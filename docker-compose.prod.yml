version: "3.8"

services:
  backend:
    # Pull from GHCR instead of building locally
    image: ghcr.io/njmsaikat/test-ghcr-backend:latest
    restart: always
    container_name: backend
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 myproject.wsgi:application"
    volumes:
      # Only mount persistent data, NOT source code
      - static_volume:/app/backend/static
      - media_volume:/app/backend/media
      - log_volume:/app/backend/media/log
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - main
    env_file:
      - .env.prod
    environment:
      - DEBUG=False

  db:
    image: postgres:14-alpine
    restart: always
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_DB: ${DB_NAME:-mydb}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: "Asia/Dhaka"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - main
    # Security: Don't expose database port publicly in production
    # Only backend container can access it via Docker network

networks:
  main:
    driver: bridge

volumes:
  pgdata:
  static_volume:
  media_volume:
  log_volume:
