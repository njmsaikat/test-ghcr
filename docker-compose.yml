services:
  backend:
    # For development: builds locally
    # For production: pulls from GHCR (set image and comment out build)
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    # Uncomment for production and set your GitHub username:
    image: ghcr.io/njmsaikat/test-ghcr-backend:latest

    restart: always
    container_name: backend

    # Development command (runserver)
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

    # Production command (gunicorn) - uncomment for production:
    # command: >
    #   sh -c "python manage.py wait_for_db &&
    #          python manage.py migrate &&
    #          python manage.py collectstatic --noinput &&
    #          gunicorn --bind 0.0.0.0:8000 --workers 3 myproject.wsgi:application"

    volumes:
      # Development: mount source code for live reload
      - .:/app
      # Production: only mount persistent data (comment above, uncomment below)
      # - static_volume:/app/backend/static
      # - media_volume:/app/backend/media

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    depends_on:
      - db

    networks:
      - main

    env_file:
      - .env

  db:
    image: postgres:14-alpine
    restart: always
    container_name: db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: "Asia/Dhaka"

    ports:
      # Only expose in development, comment out for production
      - "${DB_EXTERNAL_PORT:-5439}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - main

networks:
  main:
    driver: bridge

volumes:
  pgdata:
  static_volume:
  media_volume:
